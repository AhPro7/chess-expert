<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Expert — Play a Neural Net</title>
<meta name="description" content="Challenge a neural network trained on grandmaster games. Runs in your browser — no server, no GPU.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sq-light: #EEEED2;
    --sq-dark:  #769656;
    --sq-sel:   rgba(246,246,105,0.8);
    --sq-last:  rgba(205,210,106,0.7);
    --bg:       #161512;
    --surface:  #1e1c1a;
    --surface2: #272422;
    --border:   #3a3733;
    --text:     #e8e6e3;
    --muted:    #9e9a94;
    --accent:   #759900;
    --accent-h: #8ab000;
    --gold:     #f6a623;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 12px 48px;
  }

  /* ── Header ── */
  header { text-align: center; margin-bottom: 16px; }
  header h1 {
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 30%, #b8a870);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.5; }
  header a { color: #7eaee8; text-decoration: none; }
  header a:hover { text-decoration: underline; }

  /* ── Main layout ── */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 13px;
    width: 100%;
    max-width: 520px;
  }

  /* ── Status bar ── */
  .status-bar {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 46px;
  }
  #status { font-size: 15px; font-weight: 600; }
  #loading { color: var(--gold); }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    display: none;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .pulse-dot.on { display: block; }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:0.3; transform:scale(0.7); }
  }

  /* ── Board ── */
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);   /* ← equal rows — fixes squashed empty ranks */
    width: min(90vw, 480px);
    aspect-ratio: 1 / 1;
    border: 2px solid #111;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    user-select: none;
  }

  /* ── Individual square ── */
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    /* font-size drives piece glyph size */
    font-size: min(10vw, 54px);
    line-height: 1;
    cursor: pointer;
    transition: filter 0.08s;
  }
  .sq:hover { filter: brightness(1.1); }

  /* Square colors */
  .sq.light { background: var(--sq-light); }
  .sq.dark  { background: var(--sq-dark); }
  .sq.sel   { background: var(--sq-sel)  !important; }
  .sq.last  { background: var(--sq-last) !important; }

  /* Legal-move dots — rendered with ::after so they sit BEHIND the piece glyph */
  .sq.tgt::after {
    content: "";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Small dot for empty squares */
    background: radial-gradient(circle, rgba(0,0,0,0.22) 28%, transparent 29%);
    pointer-events: none;
    z-index: 1;
  }
  /* Ring for occupied (capture) targets */
  .sq.tgt.occ::after {
    background: none;
    box-shadow: inset 0 0 0 5px rgba(0,0,0,0.22);
    border-radius: 0;
  }

  /* ── Piece glyphs ── */
  /* White: outline/hollow Unicode pieces */
  .pw {
    color: #fff;
    text-shadow: 0 0 3px #000, 0 0 2px #000, 0 1px 4px rgba(0,0,0,0.85);
    position: relative; z-index: 2; pointer-events: none; line-height: 1;
  }
  /* Black: filled/solid Unicode pieces */
  .pb {
    color: #1a1a1a;
    text-shadow: 0 1px 2px rgba(255,255,255,0.3);
    position: relative; z-index: 2; pointer-events: none; line-height: 1;
  }

  /* ── Embedded board coordinates (chess.com style) ── */
  /* Labels live INSIDE the corner of the relevant cell — always perfectly aligned */
  .coord {
    position: absolute;
    font-size: clamp(9px, 1.5vw, 11px);
    font-weight: 700;
    line-height: 1;
    pointer-events: none;
    z-index: 3;
    /* Color contrasts with the square it's on */
  }
  .sq.light .coord { color: var(--sq-dark); }
  .sq.dark  .coord { color: var(--sq-light); }
  /* Also visible when selected/highlighted */
  .sq.sel   .coord { color: rgba(80,80,10,0.7); }
  .sq.last  .coord { color: rgba(80,80,10,0.7); }

  .coord.rank { top: 2px; left: 3px; }
  .coord.file { bottom: 2px; right: 3px; }

  /* ── Controls panel ── */
  .panel {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px 17px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .ctrl-label {
    font-size: 11px; font-weight: 600;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px;
    white-space: nowrap; flex-shrink: 0;
  }
  .btn-group { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .tog {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface2);
    color: var(--muted);
    font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    transition: all 0.13s;
  }
  .tog:hover { border-color: #5a5753; color: var(--text); }
  .tog.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* Difficulty button active colors */
  .diff-tog[data-d="0"].active { background:#3d7a3d; border-color:#4d9a4d; }
  .diff-tog[data-d="1"].active { background:#7a7000; border-color:#b0a200; }
  .diff-tog[data-d="2"].active { background:#8a4a00; border-color:#c07000; }
  .diff-tog[data-d="3"].active { background:#7a1a1a; border-color:#b02020; }

  .diff-desc {
    font-size: 11px; color: var(--muted);
    text-align: right; line-height: 1.4; min-height: 14px;
  }
  .btn-new {
    width: 100%; padding: 11px;
    border: none; border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: background 0.13s, transform 0.1s;
  }
  .btn-new:hover  { background: var(--accent-h); }
  .btn-new:active { transform: scale(0.98); }
  .move-num { font-size: 11px; color: var(--muted); text-align: center; min-height: 14px; }
</style>
</head>
<body>

<header>
  <h1>♟ Chess Expert</h1>
  <p>A neural net trained on <b style="color:var(--text)">grandmaster games</b>, running in your browser via ONNX.<br>
     <a href="https://github.com/AhPro7/chess-expert" target="_blank">GitHub</a> ·
     <a href="https://huggingface.co/Ahmed007/chess-expert" target="_blank">Model on HF</a>
  </p>
</header>

<div class="main">

  <div class="status-bar">
    <div class="pulse-dot" id="dot"></div>
    <div id="status"><span id="loading">⏳ Loading model…</span></div>
  </div>

  <!-- Board: coordinates embedded inside corner cells (chess.com style) -->
  <div id="board"></div>

  <div class="panel">
    <div class="ctrl-row">
      <span class="ctrl-label">You play</span>
      <div class="btn-group">
        <button class="tog active" data-color="w">♔ White</button>
        <button class="tog"        data-color="b">♚ Black</button>
      </div>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">Difficulty</span>
      <div class="btn-group">
        <button class="tog diff-tog active" data-d="0">Beginner</button>
        <button class="tog diff-tog"        data-d="1">Club</button>
        <button class="tog diff-tog"        data-d="2">Advanced</button>
        <button class="tog diff-tog"        data-d="3">Master</button>
        <button class="tog diff-tog"        data-d="4">Grandmaster</button>
        <button class="tog diff-tog"        data-d="5">Super Master</button>
      </div>
    </div>
    <div class="diff-desc" id="ddesc">Random-ish grandmaster-style moves — for beginners</div>
    <button class="btn-new" id="btn-new">↺ New Game</button>
  </div>

  <div class="move-num" id="movenum"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script type="module">
import { Chess } from "./chess.js";

ort.env.wasm.numThreads = 1;
ort.env.wasm.wasmPaths  = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/";

// ── Piece symbol sets ────────────────────────────────────────────────────────
// White → hollow/outline Unicode chess pieces  ♙♘♗♖♕♔
// Black → filled/solid  Unicode chess pieces   ♟♞♝♜♛♚
const PW = { p:"♙", n:"♘", b:"♗", r:"♖", q:"♕", k:"♔" };
const PB = { p:"♟", n:"♞", b:"♝", r:"♜", q:"♛", k:"♚" };
const PLANE = { p:0, n:1, b:2, r:3, q:4, k:5 };

// ── Difficulty presets ───────────────────────────────────────────────────────
// The model (policy) proposes grandmaster-style moves; a shallow MATERIAL search
// (with capture quiescence) keeps the smart levels from hanging pieces. No engine
// eval — just piece values as a "don't give away material" safety net.
const DIFF = [
  { label:"Beginner", depth:0, branch:1, temp:1.6, desc:"Random-ish grandmaster-style moves — for beginners" },
  { label:"Club",     depth:0, branch:1, temp:0,   desc:"The model's top grandmaster move (no tactics check)" },
  { label:"Advanced", depth:1, branch:5, temp:0,   desc:"Checks it isn't hanging a piece (~1 s)" },
  { label:"Master",   depth:2, branch:6, temp:0,   desc:"2-ply tactical safety search (~2–3 s)" },
  { label:"Grandmaster", depth:3, branch:6, temp:0, desc:"Deeper 3-ply search — stronger, slower (~10–30 s per move)" },
  { label:"Super Master", depth:4, branch:6, temp:0, desc:"Deepest 4-ply search — strongest in-browser, but SLOW (~1–3 min per move)" },
];
let diffIdx = 0;

// ── App state ────────────────────────────────────────────────────────────────
const boardEl   = document.getElementById("board");
const statusEl  = document.getElementById("status");
const dotEl     = document.getElementById("dot");
const ddescEl   = document.getElementById("ddesc");
const movenumEl = document.getElementById("movenum");

let chess    = new Chess();
let session  = null;
let human    = "w";
let selected = null;   // currently selected square name, or null
let lastMove = null;   // { from, to } of last move made
let busy     = false;
let plyCount = 0;

// ── Board encoding ───────────────────────────────────────────────────────────
// square name 'e2' → flat index matching src/encoding.board_to_tensor
function sqidx(sq) {
  return (sq.charCodeAt(1) - 49) * 8 + (sq.charCodeAt(0) - 97);
}

function boardToTensor() {
  const arr = new Float32Array(17 * 64);
  const FILES = "abcdefgh";
  for (let rank = 0; rank < 8; rank++) {
    for (let file = 0; file < 8; file++) {
      const pc = chess.get(FILES[file] + (rank + 1));
      if (pc) {
        const plane = PLANE[pc.type] + (pc.color === "w" ? 0 : 6);
        arr[plane * 64 + rank * 8 + file] = 1;
      }
    }
  }
  if (chess.turn() === "w") arr.fill(1, 12*64, 13*64);
  const castle = chess.fen().split(" ")[2];
  ["K","Q","k","q"].forEach((c,i) => {
    if (castle.includes(c)) arr.fill(1, (13+i)*64, (14+i)*64);
  });
  return arr;
}

// ── ONNX inference ────────────────────────────────────────────────────────────
async function infer() {
  const t = new ort.Tensor("float32", boardToTensor(), [1,17,8,8]);
  const o = await session.run({ board: t });
  return { policy: o.policy.data, value: o.value.data[0] };
}

function legalQ() {
  return chess.moves({ verbose:true }).filter(m => !m.promotion || m.promotion === "q");
}

// ── Material evaluation (side-to-move POV, in pawns) ─────────────────────────
const VAL = { p:1, n:3, b:3, r:5, q:9, k:0 };
function materialEval() {
  let s = 0;
  for (const row of chess.board())
    for (const pc of row)
      if (pc) s += (pc.color === chess.turn() ? 1 : -1) * VAL[pc.type];
  return s;
}
function isCap(m) { return m.flags.includes("c") || m.flags.includes("e"); }
function isChk(m) { return m.san.includes("+") || m.san.includes("#"); }

// ── Capture quiescence (material only, NO neural-net calls → fast) ────────────
// Resolves capture sequences so a leaf never mis-scores a hanging piece.
function quiescence(alpha, beta) {
  if (chess.in_checkmate()) return -1e6;
  if (chess.in_stalemate() || chess.in_draw()) return 0;
  let stand = materialEval();
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  const caps = chess.moves({ verbose:true })
    .filter(m => isCap(m) && (!m.promotion || m.promotion === "q"))
    .sort((a,b) => (VAL[b.captured||"p"]*10 - VAL[b.piece]) - (VAL[a.captured||"p"]*10 - VAL[a.piece]));
  for (const m of caps) {
    chess.move({ from:m.from, to:m.to, promotion:"q" });
    const score = -quiescence(-beta, -alpha);
    chess.undo();
    if (score >= beta) return beta;
    if (score > alpha) alpha = score;
  }
  return alpha;
}

// ── Candidate moves: top-`branch` policy ∪ ALL captures ∪ ALL checks ─────────
// Including every capture/check is what lets the search SEE a refutation that
// the policy ranks low — the fix for hanging pieces.
function candidateMoves(policy, branch) {
  const moves = legalQ();
  const keep = new Map();
  moves.map(m => ({ m, s: policy[sqidx(m.from)*64 + sqidx(m.to)] }))
       .sort((a,b) => b.s - a.s)
       .slice(0, branch)
       .forEach(({ m }) => keep.set(m.from + m.to, m));
  for (const m of moves) if (isCap(m) || isChk(m)) keep.set(m.from + m.to, m);
  const ordKey = m => isCap(m) ? 30000 + VAL[m.captured||"p"]*10 - VAL[m.piece]
                    : isChk(m) ? 20000
                    : 10000 + policy[sqidx(m.from)*64 + sqidx(m.to)];
  return [...keep.values()].sort((a,b) => ordKey(b) - ordKey(a)).slice(0, 14);
}

// ── Negamax: policy-guided candidates, material quiescence at the leaves ──────
async function negamax(depth, alpha, beta, branch) {
  if (chess.in_checkmate()) return -1e6;
  if (chess.in_stalemate() || chess.in_draw()) return 0;
  if (depth <= 0) return quiescence(alpha, beta);   // no NN below here → fast
  const { policy } = await infer();
  let best = -Infinity;
  for (const m of candidateMoves(policy, branch)) {
    chess.move({ from:m.from, to:m.to, promotion:"q" });
    const score = -(await negamax(depth-1, -beta, -alpha, branch));
    chess.undo();
    if (score > best)  best  = score;
    if (best  > alpha) alpha = best;
    if (alpha >= beta) break;   // alpha-beta prune
  }
  return best;
}

// ── Pick engine move ──────────────────────────────────────────────────────────
async function pickMove() {
  const moves = legalQ();
  if (!moves.length) return null;
  const cfg = DIFF[diffIdx];
  const { policy } = await infer();
  const logit = m => policy[sqidx(m.from)*64 + sqidx(m.to)];

  if (cfg.depth === 0) {                       // pure policy (no search)
    if (cfg.temp <= 0) return moves.reduce((a,b) => logit(b) > logit(a) ? b : a);
    const maxL = Math.max(...moves.map(logit));
    const w    = moves.map(m => Math.exp((logit(m) - maxL) / cfg.temp));
    const tot  = w.reduce((a,b) => a+b, 0);
    let r = Math.random() * tot;
    for (let i = 0; i < moves.length; i++) { r -= w[i]; if (r <= 0) return moves[i]; }
    return moves[0];
  }

  // Material search over policy candidates
  const cands = candidateMoves(policy, cfg.branch);
  let bestMove = cands[0], bestScore = -Infinity;
  for (const m of cands) {
    chess.move({ from:m.from, to:m.to, promotion:"q" });
    const score = -(await negamax(cfg.depth - 1, -Infinity, Infinity, cfg.branch));
    chess.undo();
    if (score > bestScore) { bestScore = score; bestMove = m; }
  }
  return bestMove;
}

// ── Status line ───────────────────────────────────────────────────────────────
function statusText() {
  if (chess.game_over()) {
    if (chess.in_checkmate())
      return chess.turn() === human ? "🏁 You lost — checkmate" : "🎉 You won — checkmate!";
    if (chess.in_stalemate())            return "½ Draw — stalemate";
    if (chess.in_threefold_repetition()) return "½ Draw — threefold repetition";
    if (chess.insufficient_material())   return "½ Draw — insufficient material";
    return "½ Draw";
  }
  const yours = chess.turn() === human;
  const chk   = chess.in_check() ? "  ⚠️ Check!" : "";
  if (busy) return `⏳ ${DIFF[diffIdx].label} is thinking…${chk}`;
  return (yours ? "Your move" : "") + chk;
}

// ── Render board ──────────────────────────────────────────────────────────────
function render() {
  boardEl.innerHTML = "";

  // When playing White: rank 8 on top, a-file on left
  // When playing Black: rank 1 on top, h-file on left
  const rankOrder = human === "w" ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  const fileOrder = human === "w" ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
  const FILES     = "abcdefgh";

  // Which rank/file indices are at the visual edges
  const topRank    = rankOrder[0];
  const bottomRank = rankOrder[7];
  const leftFile   = fileOrder[0];
  const rightFile  = fileOrder[7];

  const targets = selected
    ? chess.moves({ square: selected, verbose:true }).map(m => m.to)
    : [];

  for (let ri = 0; ri < 8; ri++) {
    const rank = rankOrder[ri];
    for (let fi = 0; fi < 8; fi++) {
      const file = fileOrder[fi];
      const sq   = FILES[file] + (rank + 1);

      const cell = document.createElement("div");

      // ── Square color ──────────────────────────────────────────────────────
      // a1 (rank=0,file=0) must be dark. (rank+file) even → dark. ✓
      const isLight = (rank + file) % 2 !== 0;
      cell.className = "sq " + (isLight ? "light" : "dark");

      // ── Highlights ───────────────────────────────────────────────────────
      if (sq === selected) {
        cell.classList.add("sel");
      } else if (lastMove && (sq === lastMove.from || sq === lastMove.to)) {
        cell.classList.add("last");
      }

      // ── Legal-move indicators ─────────────────────────────────────────────
      const pc = chess.get(sq);
      if (targets.includes(sq)) {
        cell.classList.add("tgt");
        if (pc) cell.classList.add("occ");
      }

      // ── Piece glyph ───────────────────────────────────────────────────────
      if (pc) {
        const span = document.createElement("span");
        if (pc.color === "w") {
          span.className   = "pw";
          span.textContent = PW[pc.type];  // ♙♘♗♖♕♔  (hollow outline)
        } else {
          span.className   = "pb";
          span.textContent = PB[pc.type];  // ♟♞♝♜♛♚  (filled solid)
        }
        cell.appendChild(span);
      }

      // ── Embedded coordinates (chess.com style) ───────────────────────────
      // Rank number: top-left corner of leftmost cell in each row
      if (fi === 0) {
        const lbl = document.createElement("span");
        lbl.className   = "coord rank";
        lbl.textContent = rank + 1;        // 1-8
        cell.appendChild(lbl);
      }
      // File letter: bottom-right corner of each cell in the bottom row
      if (ri === 7) {
        const lbl = document.createElement("span");
        lbl.className   = "coord file";
        lbl.textContent = FILES[file];     // a-h
        cell.appendChild(lbl);
      }

      cell.onclick = () => onClick(sq);
      boardEl.appendChild(cell);
    }
  }

  statusEl.textContent = statusText();
  dotEl.classList.toggle("on", busy);
  movenumEl.textContent = plyCount > 0
    ? `Move ${Math.ceil(plyCount / 2)}  (${plyCount} half-moves)` : "";
}

// ── Click handler ─────────────────────────────────────────────────────────────
async function onClick(sq) {
  if (busy || chess.game_over() || chess.turn() !== human) return;
  const pc = chess.get(sq);

  if (selected === null) {
    if (pc && pc.color === human) { selected = sq; render(); }
    return;
  }

  const legal  = chess.moves({ square: selected, verbose:true });
  const chosen = legal.find(m => m.to === sq);

  if (chosen) {
    chess.move({ from: selected, to: sq, promotion: "q" });
    lastMove = { from: selected, to: sq }; plyCount++;
    selected = null;
    render();
    await engineReply();
  } else {
    selected = (pc && pc.color === human) ? sq : null;
    render();
  }
}

// ── Engine reply ──────────────────────────────────────────────────────────────
async function engineReply() {
  if (chess.game_over() || chess.turn() === human) return;
  busy = true; render();
  await new Promise(r => setTimeout(r, 40));   // let UI repaint
  const m = await pickMove();
  if (m) {
    chess.move({ from: m.from, to: m.to, promotion: "q" });
    lastMove = { from: m.from, to: m.to }; plyCount++;
  }
  busy = false; render();
}

// ── New game ──────────────────────────────────────────────────────────────────
async function newGame() {
  chess    = new Chess();
  selected = null; lastMove = null; plyCount = 0; busy = false;
  render();
  if (chess.turn() !== human) await engineReply();
}

// ── UI wiring ─────────────────────────────────────────────────────────────────
document.querySelectorAll("[data-color]").forEach(btn => {
  btn.onclick = () => {
    if (btn.dataset.color === human) return;
    human = btn.dataset.color;
    document.querySelectorAll("[data-color]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    newGame();
  };
});

document.querySelectorAll(".diff-tog").forEach(btn => {
  btn.onclick = () => {
    diffIdx = +btn.dataset.d;
    document.querySelectorAll(".diff-tog").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    ddescEl.textContent = DIFF[diffIdx].desc;
  };
});

document.getElementById("btn-new").onclick = newGame;

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    session = await ort.InferenceSession.create("chess_expert.onnx",
                { executionProviders: ["wasm"] });

    // Sanity: starting-position plane sum must equal 352
    const sum = boardToTensor().reduce((a,b) => a+b, 0);
    console.log("[chess-expert] model loaded ✓  encoding sum =", sum, sum===352?"OK":"MISMATCH!");

    document.getElementById("loading")?.remove();
    await newGame();
  } catch (e) {
    statusEl.innerHTML = `<span style="color:#e57373">❌ Failed to load: ${e}</span>`;
    console.error(e);
  }
})();
</script>
